name: CI and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: wassup
            archive: wassup-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            binary: wassup
            archive: wassup-linux-arm64.tar.gz
          - goos: darwin
            goarch: amd64
            binary: wassup
            archive: wassup-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            binary: wassup
            archive: wassup-darwin-arm64.tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p package dist
          go build -trimpath -ldflags="-s -w" -o "package/${{ matrix.binary }}" .
          tar -C package -czf "dist/${{ matrix.archive }}" "${{ matrix.binary }}"
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: wassup-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download build archives
        uses: actions/download-artifact@v4
        with:
          pattern: wassup-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum wassup-*.tar.gz > checksums.txt
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --generate-notes --title "wassup $GITHUB_REF_NAME"
          fi
